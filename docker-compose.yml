services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum
      POSTGRES_DB: quorum
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
